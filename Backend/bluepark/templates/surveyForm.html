{% extends "base_public.html" %}
{% block title %}BluePark | Feedback{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl px-4 sm:px-6 lg:px-8 py-16">
    <h1 class="text-2xl font-semibold tracking-tight" style="color: var(--color-ink);">Tell us how we're doing</h1>
    <p class="mt-1 text-sm" style="color: var(--color-ink-soft);">Takes about 3 minutes. It genuinely helps.</p>

    <form method="POST" class="mt-8 rounded-2xl border p-6 space-y-6" style="background: var(--color-surface); border-color: var(--color-line);">
        {% csrf_token %}

        <div>
            <label for="platforms" class="block text-sm font-medium mb-1.5" style="color: var(--color-ink);">Where did you hear about us?</label>
            <select name="platforms" id="platforms"
                class="w-full rounded-lg border px-3.5 py-2.5 text-sm outline-none transition focus:ring-2"
                style="background: var(--color-bg); border-color: var(--color-line); color: var(--color-ink); --tw-ring-color: var(--color-accent);">
                <option value="Newspaper">Newspaper</option>
                <option value="Ads">Advertisements</option>
                <option value="sms">SMS</option>
                <option value="friends">Friends</option>
                <option value="osource" selected>Other source</option>
            </select>
        </div>

        <div>
            <label for="username" class="block text-sm font-medium mb-1.5" style="color: var(--color-ink);">Your name</label>
            <input type="text" name="username" id="username" placeholder="Enter your name"
                class="w-full rounded-lg border px-3.5 py-2.5 text-sm outline-none transition focus:ring-2"
                style="background: var(--color-bg); border-color: var(--color-line); color: var(--color-ink); --tw-ring-color: var(--color-accent);">
        </div>

        <div>
            <p class="block text-sm font-medium mb-2" style="color: var(--color-ink);">Have you ordered with us before?</p>
            <div class="flex gap-6 text-sm" style="color: var(--color-ink);">
                <label class="flex items-center gap-2"><input type="radio" name="purchase" value="True" required> Yes</label>
                <label class="flex items-center gap-2"><input type="radio" name="purchase" value="False"> No</label>
            </div>
        </div>

        <div>
            <label for="favourite" class="block text-sm font-medium mb-1.5" style="color: var(--color-ink);">Favourite items on our menu?</label>
            <input type="text" name="favourite" id="favourite" placeholder="e.g. Paneer Tikka, Hyderabadi Biryani"
                class="w-full rounded-lg border px-3.5 py-2.5 text-sm outline-none transition focus:ring-2"
                style="background: var(--color-bg); border-color: var(--color-line); color: var(--color-ink); --tw-ring-color: var(--color-accent);">
        </div>

        <div>
            <label for="email" class="block text-sm font-medium mb-1.5" style="color: var(--color-ink);">Email <span style="color: var(--color-ink-soft);">(for offers, optional)</span></label>
            <input type="email" name="email" id="email" placeholder="you@example.com"
                class="w-full rounded-lg border px-3.5 py-2.5 text-sm outline-none transition focus:ring-2"
                style="background: var(--color-bg); border-color: var(--color-line); color: var(--color-ink); --tw-ring-color: var(--color-accent);">
        </div>

        <div x-data="{ rating: 3, emoji: ['😠', '🙁', '😐', '🙂', '😄', '🥰'] }">
            <label class="block text-sm font-medium mb-2" style="color: var(--color-ink);">Rate your experience</label>
            <div class="flex items-center gap-4">
                <input type="range" name="rating" min="0" max="5" x-model.number="rating" class="flex-1 accent-[var(--color-accent)]">
                <span class="text-2xl" x-text="emoji[rating]"></span>
            </div>
        </div>

        <div>
            <label for="feedback" class="block text-sm font-medium mb-1.5" style="color: var(--color-ink);">Anything else you'd like to share?</label>
            <textarea name="feedback" id="feedback" maxlength="300" rows="4" placeholder="Your feedback"
                class="w-full rounded-lg border px-3.5 py-2.5 text-sm outline-none transition focus:ring-2 resize-none"
                style="background: var(--color-bg); border-color: var(--color-line); color: var(--color-ink); --tw-ring-color: var(--color-accent);"></textarea>
        </div>

        <button type="submit" class="w-full rounded-lg py-2.5 text-sm font-medium text-white transition hover:opacity-90" style="background: var(--color-accent);">
            Submit feedback
        </button>
    </form>
</div>
{% endblock %}
