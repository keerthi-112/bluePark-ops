
<!DOCTYPE html>
<html lang="en-US">
<html>
  <head>
    <title>Register Form Design</title>
      <link rel="stylesheet" type="text/css" href="css/register.css">
      <script type="text/javascript" src="js/register.js"></script>
    </head>
    <body>
      <div class="loginbox">
        <img src="images/p2.jpg" class="avatar">
        <h1>Register</h1>
        <form action="" method="post" onsubmit="return validate()">
            <p>Username</p>
            <input type="text" id="uname" name="uname" placeholder="Enter new username" required>
            <p>New Password</p>
            <input type="password" id="pwd" name="pwd" placeholder="Enter password" required>
            <p>Confirm Password</p>
            <input type="password" id="pwd1" name="pwd1" placeholder="Confirm password" required>
            <input type="submit" name="" value="submit">
          </form>
        </div>
    </body>
</html>
